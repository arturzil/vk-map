<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная карта бульвара</title>
  <style>
    :root {
      --bg-page: #F5F6F8;
      --bg-card: #FFFFFF;
      --text-main: #1C1D1F;
      --text-muted: #818C99;
      --accent-blue: #0077FF;
      --accent-hover: #0062D1;
      --border-light: #E1E3E6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-page); color: var(--text-main); padding: 16px; }

    .app-container { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    /* Шапка и поиск */
    .header-card { background: var(--bg-card); padding: 16px 20px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
    .header-title { font-size: 20px; font-weight: 700; }
    .header-sub { font-size: 13px; color: var(--text-muted); }

    .search-box { position: relative; }
    .search-input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1px solid #DCE1E6; background: #F5F6F8; font-size: 15px; outline: none; transition: 0.2s;
    }
    .search-input:focus { border-color: var(--accent-blue); background: #FFF; }

    /* Результаты поиска */
    .search-results {
      margin-top: 8px; display: none; flex-direction: column;
      background: #FFF; border-radius: 12px; border: 1px solid var(--border-light); overflow: hidden;
    }
    .search-item {
      padding: 12px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #F0F2F5; font-size: 14px; transition: background 0.15s;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: #F0F5FF; }
    .search-item-building {
      background: #EBF3FF; color: var(--accent-blue); padding: 3px 8px;
      border-radius: 6px; font-size: 12px; font-weight: 600;
    }

    /* Карточка с картой бульвара */
    .map-card { background: var(--bg-card); padding: 16px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .map-hint { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    .svg-viewport {
      width: 100%; overflow-x: auto; border-radius: 12px;
      border: 1px solid #EBEDF0; background: #F9FAFB; position: relative;
      -webkit-overflow-scrolling: touch;
    }
    .svg-viewport svg { width: 100%; min-width: 780px; height: auto; display: block; }

    /* Пульсация и перелив для зданий */
    @keyframes buildingPulse {
      0% {
        filter: drop-shadow(0 0 2px rgba(0, 119, 255, 0.3));
        opacity: 0.9;
      }
      50% {
        filter: drop-shadow(0 0 10px rgba(0, 119, 255, 0.9));
        opacity: 1;
      }
      100% {
        filter: drop-shadow(0 0 2px rgba(0, 119, 255, 0.3));
        opacity: 0.9;
      }
    }

    .building-zone {
      cursor: pointer;
      animation: buildingPulse 2.5s infinite ease-in-out;
      transition: transform 0.2s ease, filter 0.2s ease;
      transform-box: fill-box;
      transform-origin: center;
    }
    .building-zone:hover {
      animation: none;
      opacity: 1;
      filter: drop-shadow(0 0 12px rgba(0, 119, 255, 1));
      transform: scale(1.02);
    }
    .building-zone.highlighted {
      stroke: var(--accent-blue) !important;
      stroke-width: 4px !important;
    }

    /* Автоматические таблички с адресами поверх SVG */
    .svg-badge-bg { fill: rgba(255, 255, 255, 0.95); stroke: #DCE1E6; stroke-width: 1; pointer-events: none; }
    .svg-badge-text {
      font-size: 11px; font-weight: 700; fill: #1C1D1F;
      text-anchor: middle; dominant-baseline: central; pointer-events: none;
    }

    /* Быстрые кнопки зданий под картой */
    .buildings-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .b-chip {
      padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border-light);
      background: #FFF; font-size: 13px; font-weight: 600; color: var(--text-main);
      cursor: pointer; transition: 0.2s;
    }
    .b-chip:hover { border-color: var(--accent-blue); color: var(--accent-blue); background: #F5F9FF; }

    /* Модальное окно / экран выбранного здания */
    .building-modal {
      display: none; background: var(--bg-card); padding: 20px; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); border: 1px solid var(--border-light);
      animation: fadeIn 0.2s ease;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; }
    .back-btn {
      padding: 8px 14px; border-radius: 10px; border: none; background: #EBF3FF;
      color: var(--accent-blue); font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .back-btn:hover { background: #DCEBFF; }
    .floor-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .floor-tab {
      padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border-light);
      background: #F5F6F8; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .floor-tab.active { background: var(--accent-blue); color: #FFF; border-color: var(--accent-blue); }

    .tenant-list { display: flex; flex-direction: column; gap: 8px; }
    .tenant-row {
      padding: 12px; border-radius: 10px; background: #F8F9FA;
      display: flex; justify-content: space-between; align-items: center;
    }
    .tenant-row.target-tenant { background: #EBF3FF; border: 1.5px solid var(--accent-blue); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Шапка + Глобальный поиск -->
  <div class="header-card">
    <div class="header-top">
      <div class="header-title">Навигатор по бульвару</div>
      <div class="header-sub">Выберите здание на схеме или найдите компанию</div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск компании, магазина или услуги...">
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <!-- Экран 1: Общая карта бульвара -->
  <div id="boulevardView" class="map-card">
    <div class="map-hint">
      <span>Нажмите на здание, чтобы открыть схему помещений</span>
      <span>↔ Прокрутите карту</span>
    </div>

    <div id="svgContainer" class="svg-viewport">
      <div style="padding: 40px; text-align: center; color: #818C99;">Загрузка карты бульвара...</div>
    </div>

    <div id="buildingsBar" class="buildings-bar"></div>
  </div>

  <!-- Экран 2: Схема выбранного здания -->
  <div id="buildingView" class="building-modal">
    <div class="modal-header">
      <div>
        <h2 id="selectedBuildingTitle" style="font-size: 20px;">Здание</h2>
        <div id="selectedBuildingSub" style="font-size: 13px; color: #818C99;">Схема помещений</div>
      </div>
      <button class="back-btn" onclick="showBoulevard()">← На карту бульвара</button>
    </div>

    <div id="floorTabs" class="floor-tabs"></div>

    <div id="buildingPlanPlaceholder" style="padding: 24px; border: 1.5px dashed #DCE1E6; border-radius: 12px; text-align: center; color: #818C99; margin-bottom: 16px;">
      Здесь отобразится SVG-схема выбранного этажа
    </div>

    <div id="tenantList" class="tenant-list"></div>
  </div>
</div>

<script>
  const buildingsData = {
    "z1": {
      title: "Мира, 31Б",
      shortLabel: "Мира 31Б",
      floors: ["1", "2", "3"],
      svgFiles: { "1": "mira31b-1.svg", "2": "mira31b-2.svg", "3": "mira31b-3.svg" },
      tenants: [
        { room: "office-1", floor: "1", name: "Супермаркет", category: "Продукты" },
        { room: "office-2", floor: "2", name: "Юридический центр", category: "Услуги" }
      ]
    },
    "z2": {
      title: "Мира, 31В",
      shortLabel: "Мира 31В",
      floors: ["1"],
      svgFiles: { "1": "mira31v.svg" },
      tenants: [
        { room: "office-1", floor: "1", name: "Кофейня «Бодрый день»", category: "Кофе, выпечка" }
      ]
    },
    "z3": {
      title: "Павильон",
      shortLabel: "Павильон",
      floors: ["1"],
      svgFiles: { "1": "pavilion.svg" },
      tenants: [
        { room: "office-1", floor: "1", name: "Фермерские продукты", category: "Торговые ряды" }
      ]
    },
    "z4": {
      title: "Мира, 25В К1",
      shortLabel: "Мира 25В К1",
      floors: ["1"],
      svgFiles: { "1": "mira25v-k1.svg" },
      tenants: [
        { room: "office-1", floor: "1", name: "Аптека «Здоровье»", category: "Аптека" }
      ]
    },
    "z5": {
      title: "Мира, 25В К2",
      shortLabel: "Мира 25В К2",
      floors: ["1"],
      svgFiles: { "1": "mira25v-k2.svg" },
      tenants: [
        { room: "office-1", floor: "1", name: "ПВЗ Ozon", category: "Пункт выдачи" },
        { room: "office-2", floor: "1", name: "Салон красоты «Марсель»", category: "Услуги" }
      ]
    },
    "z6": {
      title: "Мира, 21В",
      shortLabel: "Мира 21В",
      floors: ["1"],
      svgFiles: { "1": "mira21v.svg" },
      tenants: [
        { room: "office-1", floor: "1", name: "Пекарня «Хлебный двор»", category: "Выпечка" }
      ]
    }
  };

  async function loadBoulevardMap() {
    const container = document.getElementById('svgContainer');
    try {
      const response = await fetch('karta.svg');
      if (!response.ok) throw new Error('Файл karta.svg не найден');
      const svgText = await response.text();
      container.innerHTML = svgText;

      const svgEl = container.querySelector('svg');
      if (!svgEl) return;

      Object.entries(buildingsData).forEach(([id, info]) => {
        const buildingShape = svgEl.getElementById(id);
        if (!buildingShape) {
          console.warn(`Элемент с id="${id}" не найден в karta.svg`);
          return;
        }

        buildingShape.classList.add('building-zone');
        buildingShape.addEventListener('click', () => openBuilding(id));

        addAutoLabel(svgEl, buildingShape, info.shortLabel);
      });
    } catch (err) {
      container.innerHTML = `<div style="padding: 32px; text-align: center; color: #D93025;">
        Не удалось загрузить <b>karta.svg</b>. Убедитесь, что файл лежит в репозитории рядом с index.html.
      </div>`;
    }
  }

  function addAutoLabel(svgEl, shape, text) {
    const bbox = shape.getBBox();
    const cx = bbox.x + bbox.width / 2;
    const cy = bbox.y + bbox.height / 2;
    const padX = 10;
    const labelWidth = text.length * 7 + padX * 2;
    const labelHeight = 22;

    const ns = "http://www.w3.org/2000/svg";
    const g = document.createElementNS(ns, "g");

    const rect = document.createElementNS(ns, "rect");
    rect.setAttribute("x", cx - labelWidth / 2);
    rect.setAttribute("y", cy - labelHeight / 2);
    rect.setAttribute("width", labelWidth);
    rect.setAttribute("height", labelHeight);
    rect.setAttribute("rx", 4);
    rect.setAttribute("class", "svg-badge-bg");

    const label = document.createElementNS(ns, "text");
    label.setAttribute("x", cx);
    label.setAttribute("y", cy);
    label.setAttribute("class", "svg-badge-text");
    label.textContent = text;

    g.appendChild(rect);
    g.appendChild(label);
    svgEl.appendChild(g);
  }

  function renderBuildingChips() {
    const bar = document.getElementById('buildingsBar');
    Object.entries(buildingsData).forEach(([id, info]) => {
      const btn = document.createElement('button');
      btn.className = 'b-chip';
      btn.textContent = info.shortLabel;
      btn.onclick = () => openBuilding(id);
      bar.appendChild(btn);
    });
  }

  function openBuilding(buildingId, highlightRoom = null, targetFloor = null) {
    const data = buildingsData[buildingId];
    if (!data) return;

    document.getElementById('boulevardView').style.display = 'none';
    document.getElementById('buildingView').style.display = 'block';
    document.getElementById('searchResults').style.display = 'none';

    document.getElementById('selectedBuildingTitle').textContent = data.title;
    const activeFloor = targetFloor || data.floors[0];

    const tabsEl = document.getElementById('floorTabs');
    tabsEl.innerHTML = '';
    if (data.floors.length > 1) {
      data.floors.forEach(fl => {
        const btn = document.createElement('button');
        btn.className = 'floor-tab' + (fl === activeFloor ? ' active' : '');
        btn.textContent = `${fl} этаж`;
        btn.onclick = () => openBuilding(buildingId, highlightRoom, fl);
        tabsEl.appendChild(btn);
      });
    }

    const fileName = data.svgFiles[activeFloor] || 'plan.svg';
    document.getElementById('buildingPlanPlaceholder').innerHTML =
      `Готово к подключению файла схемы: <b>${fileName}</b> (Этаж: ${activeFloor})`;

    const listEl = document.getElementById('tenantList');
    listEl.innerHTML = '';
    const floorTenants = data.tenants.filter(t => t.floor === activeFloor);

    if (floorTenants.length === 0) {
      listEl.innerHTML = '<div style="color: #818C99; font-size: 14px;">На этом этаже пока не добавлены арендаторы</div>';
    } else {
      floorTenants.forEach(t => {
        const row = document.createElement('div');
        row.className = 'tenant-row' + (t.room === highlightRoom ? ' target-tenant' : '');
        row.innerHTML = `<div><strong>${t.name}</strong><div style="font-size:12px; color:#818C99;">${t.category}</div></div>
                         <span style="font-size:12px; font-weight:600;">${t.room}</span>`;
        listEl.appendChild(row);
      });
    }
  }

  function showBoulevard() {
    document.getElementById('buildingView').style.display = 'none';
    document.getElementById('boulevardView').style.display = 'block';
  }

  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  searchInput.addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    searchResults.innerHTML = '';
    if (!q) {
      searchResults.style.display = 'none';
      return;
    }

    const matches = [];
    Object.entries(buildingsData).forEach(([bId, bData]) => {
      bData.tenants.forEach(t => {
        if (t.name.toLowerCase().includes(q) || t.category.toLowerCase().includes(q)) {
          matches.push({ bId, bTitle: bData.shortLabel, ...t });
        }
      });
    });

    if (matches.length === 0) {
      searchResults.innerHTML = '<div class="search-item" style="color:#818C99;">Ничего не найдено</div>';
    } else {
      matches.forEach(m => {
        const div = document.createElement('div');
        div.className = 'search-item';
        div.innerHTML = `<span><strong>${m.name}</strong> <small style="color:#818C99;">(${m.category})</small></span>
                         <span class="search-item-building">${m.bTitle} • ${m.floor} эт.</span>`;
        div.onclick = () => openBuilding(m.bId, m.room, m.floor);
        searchResults.appendChild(div);
      });
    }
    searchResults.style.display = 'flex';
  });

  renderBuildingChips();
  loadBoulevardMap();
</script>
</body>
</html>
